name: Atualizar projetos públicos

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 03:00 UTC
  workflow_dispatch:        # permite rodar manualmente

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar lista de repos
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, re

          url = "https://api.github.com/users/marlon-vidalis/repos?type=public&per_page=100"
          req = urllib.request.Request(url, headers={"User-Agent": "readme-bot"})
          repos = json.loads(urllib.request.urlopen(req).read())

          IGNORE = {"marlon-vidalis"}

          rows = []
          for r in sorted(repos, key=lambda x: x["name"]):
              if r["name"] in IGNORE:
                  continue
              name = r["name"]
              desc = r["description"] or ""
              url  = r["html_url"]
              rows.append(f"| [{name}]({url}) | {desc} |")

          block = "\n".join(rows)
          marker_start = "<!-- REPOS_START -->"
          marker_end   = "<!-- REPOS_END -->"

          with open("README.md", "r") as f:
              content = f.read()

          new_section = (
              f"{marker_start}\n"
              f"### 📁 Todos os projetos públicos\n\n"
              f"| Projeto | Descrição |\n"
              f"|---|---|\n"
              f"{block}\n"
              f"{marker_end}"
          )

          content = re.sub(
              rf"{re.escape(marker_start)}.*?{re.escape(marker_end)}",
              new_section,
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w") as f:
              f.write(content)

          print("README atualizado.")
          PYEOF

      - name: Commit se houver mudança
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: atualiza lista de projetos públicos"
          git push
