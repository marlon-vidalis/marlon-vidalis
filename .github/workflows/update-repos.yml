name: Atualizar projetos públicos

'on':
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: update-repos
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sincronizar com remote
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Gerar tabela de projetos
        run: |
          python3 << 'PYEOF'
          import json
          import re
          import urllib.request

          USERNAME = "marlon-vidalis"
          IGNORE = {"marlon-vidalis"}
          DISPLAY_NAME_OVERRIDES = {
              "desvendando_matematica": "Desvendando Matemática",
          }

          # Ícones por linguagem e por framework/repositório.
          LANG_ICONS = {
              "Python": (
                  "https://skillicons.dev/icons?i=python&theme=light",
                  "https://python.org",
                  "Python",
              ),
              "SQL": (
                  "https://skillicons.dev/icons?i=postgres&theme=light",
                  "https://postgresql.org",
                  "SQL",
              ),
              "Shell": None,
              "Dockerfile": None,
          }

          FRAMEWORK_ICONS = {
              "desvendando_matematica": [
                  (
                      "https://streamlit.io/images/brand/streamlit-mark-color.svg",
                      "https://streamlit.io",
                      "Streamlit",
                  ),
              ],
              "estudos-tecnicos": [
                  (
                      "https://skillicons.dev/icons?i=markdown&theme=light",
                      "https://daringfireball.net/projects/markdown/",
                      "Markdown",
                  ),
              ],
              "media-renamed": [
                  (
                      "https://skillicons.dev/icons?i=gtk&theme=light",
                      "https://gtk.org",
                      "GTK4",
                  ),
              ],
              # reservados — descomentar quando usar:
              # "algum-repo": [
              #     ("https://qgis.org/styleguide/visual/qgis-icon32.svg", "https://qgis.org", "QGIS"),
              #     ("https://earthengine.google.com/static/images/earth-engine-logo.png", "https://earthengine.google.com", "Google Earth Engine"),
              # ],
          }

          def make_link(site, img_url, title):
              return (
                  f'<a href="{site}" target="_blank">'
                  f'<img src="{img_url}" height="32" title="{title}" alt="{title}" />'
                  "</a>"
              )

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "readme-bot"})
              try:
                  with urllib.request.urlopen(req) as response:
                      return json.loads(response.read())
              except Exception as exc:
                  print(f"Aviso: falha ao consultar {url}: {exc}")
                  return []

          repos = fetch(f"https://api.github.com/users/{USERNAME}/repos?type=public&per_page=100")
          if not repos:
              print("Nenhum dado recebido da API do GitHub; nada foi alterado.")
              raise SystemExit(0)

          rows = []
          for repo in sorted(repos, key=lambda item: item["name"]):
              name = repo["name"]
              display_name = DISPLAY_NAME_OVERRIDES.get(
                  name, re.sub(r"[\W_]+", " ", name, flags=re.UNICODE).title()
              )
              if name in IGNORE:
                  continue

              description = repo["description"] or ""
              url = repo["html_url"]
              languages = fetch(f"https://api.github.com/repos/{USERNAME}/{name}/languages")
              if not languages:
                  continue

              total = sum(languages.values()) or 1

              lang_icons = []
              for lang, count in languages.items():
                  if count / total * 100 < 5:
                      continue
                  icon_data = LANG_ICONS.get(lang)
                  if not icon_data:
                      continue

                  img_url, site, title = icon_data
                  lang_icons.append(make_link(site, img_url, title))

              fw_icons = []
              for img_url, site, title in FRAMEWORK_ICONS.get(name, []):
                  fw_icons.append(make_link(site, img_url, title))

              rows.append(
                  "<tr>\n"
                  f'<td><a href="{url}">{display_name}</a></td>\n'
                  f"<td>{description}</td>\n"
                  f"<td align=\"center\">{''.join(lang_icons) or '—'}</td>\n"
                  f"<td align=\"center\">{''.join(fw_icons) or '—'}</td>\n"
                  "</tr>"
              )

          block = "\n".join(rows)
          marker_start = "<!-- REPOS_START -->"
          marker_end = "<!-- REPOS_END -->"

          with open("README.md", "r", encoding="utf-8") as readme_file:
              content = readme_file.read()

          new_section = f"{marker_start}\n{block}\n{marker_end}"
          if marker_start in content and marker_end in content:
              content = re.sub(
                  rf"{re.escape(marker_start)}.*?{re.escape(marker_end)}",
                  new_section,
                  content,
                  flags=re.DOTALL,
              )
          elif content:
              separator = "\n\n" if not content.endswith("\n") else "\n"
              content = f"{content}{separator}{new_section}\n"
          else:
              content = f"{new_section}\n"

          with open("README.md", "w", encoding="utf-8") as readme_file:
              readme_file.write(content)

          print("README atualizado.")
          PYEOF

      - name: Commit se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: atualiza projetos públicos"
          git pull --rebase origin main
          git push
